name: Photo HQ
options:
  bundleIdPrefix: com.oscast
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Photo HQ:
    type: application
    platform: iOS
    sources:
      - path: Photo HQ/Photo HQ
        excludes:
          - Preview Content/**
    resources:
      - path: Photo HQ/Photo HQ/Preview Content
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscast.Photo-HQ
        PRODUCT_NAME: Photo HQ
        PRODUCT_MODULE_NAME: Photo_HQ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo HQ
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo HQ needs photo library access so you can select photos to enhance.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Photo HQ needs permission to save enhanced photos to your photo library.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
